<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    box-sizing: border-box;
    padding: 12px;
    font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    font-size: 11px;
    line-height: 1.6;
    color: #e8e8e8;
    background: #323232;
    overflow-y: auto;
  }
  h1 {
    margin: 0 0 2px;
    font-size: 12px;
    font-weight: 600;
  }
  .sub {
    margin: 0 0 12px;
    color: #a3a3a3;
  }
  .field {
    margin-bottom: 8px;
  }
  .field label {
    display: block;
    margin-bottom: 3px;
    color: #a3a3a3;
  }
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 5px 7px;
    border: 1px solid #5a5a5a;
    border-radius: 4px;
    background: #262626;
    color: #e8e8e8;
    font-family: inherit;
    font-size: 11px;
    outline: none;
  }
  .check {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    color: #a3a3a3;
  }
  .check input {
    margin: 0 6px 0 0;
  }
  button {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 6px;
    padding: 8px 10px;
    border: 1px solid #5a5a5a;
    border-radius: 4px;
    background: #3a3a3a;
    color: #e8e8e8;
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover:not([disabled]) {
    background: #474747;
  }
  button.primary {
    border-color: transparent;
    background: #1473e6;
    color: #ffffff;
    padding: 10px;
  }
  button.primary:hover:not([disabled]) {
    background: #0d66d0;
  }
  button[disabled] {
    opacity: 0.4;
    cursor: default;
  }
  .card {
    margin: 10px 0;
    padding: 8px 10px;
    border: 1px solid #5a5a5a;
    border-radius: 4px;
    background: #2b2b2b;
  }
  .card .name {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card .meta {
    color: #a3a3a3;
  }
  .log-title {
    margin: 12px 0 4px;
    color: #a3a3a3;
  }
  .log {
    height: 150px;
    overflow-y: auto;
    padding: 6px 8px;
    border: 1px solid #5a5a5a;
    border-radius: 4px;
    background: #262626;
    font-family: Consolas, "Courier New", monospace;
    font-size: 10px;
    line-height: 1.7;
    color: #a3a3a3;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log .err {
    color: #ff8a80;
  }
</style>
</head>
<body>
  <h1>Figma 桥接</h1>
  <p class="sub" id="status">初始化中…</p>

  <div class="field">
    <label for="server">桥接服务地址</label>
    <input id="server" type="text" spellcheck="false" value="http://127.0.0.1:8765">
  </div>

  <div class="check">
    <input id="auto" type="checkbox" checked>
    <label for="auto">自动接收 Figma 发来的图片</label>
  </div>

  <button class="primary" id="save" disabled>保存并回传 Figma</button>
  <button id="pull">立即接收一张</button>
  <button id="cancel" disabled>取消当前任务</button>

  <div class="card">
    <div class="name" id="jobName">暂无任务</div>
    <div class="meta" id="jobMeta">在 Figma 面板点「发送选中到 PS」</div>
  </div>

  <div class="log-title">运行日志</div>
  <div class="log" id="log"></div>

  <script src="js/main.js"></script>
</body>
</html>
