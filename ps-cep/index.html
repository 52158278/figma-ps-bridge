<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    box-sizing: border-box;
    padding: 12px;
    font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    font-size: 11px;
    line-height: 1.6;
    color: #e8e8e8;
    background: #323232;
    overflow-y: auto;
  }
  h1 {
    margin: 0 0 2px;
    font-size: 12px;
    font-weight: 600;
  }
  .sub {
    margin: 0 0 12px;
    color: #a3a3a3;
  }
  .field {
    margin-bottom: 8px;
  }
  .field label {
    display: block;
    margin-bottom: 3px;
    color: #a3a3a3;
  }
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 5px 7px;
    border: 1px solid #5a5a5a;
    border-radius: 4px;
    background: #262626;
    color: #e8e8e8;
    font-family: inherit;
    font-size: 11px;
    outline: none;
  }
  .check {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    color: #a3a3a3;
  }
  .check input {
    margin: 0 6px 0 0;
  }
  button {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 6px;
    padding: 8px 10px;
    border: 1px solid #5a5a5a;
    border-radius: 4px;
    background: #3a3a3a;
    color: #e8e8e8;
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover:not([disabled]) {
    background: #474747;
  }
  button.primary {
    border-color: transparent;
    background: #1473e6;
    color: #ffffff;
    padding: 10px;
  }
  button.primary:hover:not([disabled]) {
    background: #0d66d0;
  }
  button[disabled] {
    opacity: 0.4;
    cursor: default;
  }
  .active-doc {
    margin: 8px 0 10px;
    color: #a3a3a3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sessions-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 12px 0 4px;
    color: #a3a3a3;
  }
  .sessions-title .count {
    color: #e8e8e8;
  }
  .sessions {
    border: 1px solid #5a5a5a;
    border-radius: 4px;
    background: #2b2b2b;
    overflow: hidden;
  }
  .sessions-empty {
    padding: 10px;
    color: #7a7a7a;
  }
  .session {
    padding: 8px 10px;
    border-bottom: 1px solid #3d3d3d;
  }
  .session:last-child {
    border-bottom: none;
  }
  .session.current {
    box-shadow: inset 2px 0 0 #1473e6;
    background: #303030;
  }
  .session-top {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .session-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }
  .badge {
    flex: none;
    padding: 0 5px;
    border-radius: 8px;
    background: #3a3a3a;
    color: #a3a3a3;
    font-size: 10px;
    line-height: 16px;
  }
  .state-open .badge {
    color: #7ec8ff;
  }
  .state-sent .badge {
    color: #9be49b;
  }
  .state-error .badge,
  .state-closed .badge {
    color: #ff8a80;
  }
  .state-opening .badge {
    color: #e8c97a;
  }
  .session-meta {
    margin-top: 2px;
    color: #8f8f8f;
    font-size: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-error {
    margin-top: 2px;
    color: #ff8a80;
    font-size: 10px;
    word-break: break-all;
  }
  .session-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .session-actions button.mini {
    width: auto;
    margin: 0;
    padding: 2px 10px;
    font-size: 10px;
  }
  .log-title {
    margin: 12px 0 4px;
    color: #a3a3a3;
  }
  .log {
    height: 150px;
    overflow-y: auto;
    padding: 6px 8px;
    border: 1px solid #5a5a5a;
    border-radius: 4px;
    background: #262626;
    font-family: Consolas, "Courier New", monospace;
    font-size: 10px;
    line-height: 1.7;
    color: #a3a3a3;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log .err {
    color: #ff8a80;
  }
</style>
</head>
<body>
  <h1>Figma 桥接</h1>
  <p class="sub" id="status">初始化中…</p>

  <div class="field">
    <label for="server">桥接服务地址</label>
    <input id="server" type="text" spellcheck="false" value="http://127.0.0.1:8765">
  </div>

  <div class="check">
    <input id="auto" type="checkbox" checked>
    <label for="auto">自动接收 Figma 发来的图片</label>
  </div>

  <button class="primary" id="save" disabled>保存并回传当前文档</button>
  <button id="sendAll" disabled>全部回传（0 个）</button>
  <button id="pull">立即接收一张</button>

  <div class="active-doc" id="activeDoc">当前文档：无</div>

  <div class="sessions-title">
    <span>Photoshop 文档</span>
    <span class="count" id="sessionCount">0</span>
  </div>
  <div class="sessions" id="sessions">
    <div class="sessions-empty">还没有从 Figma 收到的文档</div>
  </div>

  <div class="log-title">运行日志</div>
  <div class="log" id="log"></div>

  <script src="js/main.js"></script>
</body>
</html>
