<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
    --text: var(--figma-color-text, #111111);
    --muted: var(--figma-color-text-secondary, #6b6b6b);
    --border: var(--figma-color-border, #e0e0e0);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --onbrand: var(--figma-color-text-onbrand, #ffffff);
    --danger: var(--figma-color-text-danger, #d92d20);
    --ok: #14a44d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 11px/1.5 "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  h1 {
    font-size: 12px;
    font-weight: 600;
    margin: 0 0 2px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: .5; }
  .dot.on { background: var(--ok); opacity: 1; }
  .dot.bad { background: var(--danger); opacity: 1; }
  .sub { color: var(--muted); margin: 0 0 7px; font-size: 10px; }
  label { display: block; color: var(--muted); font-size: 10px; margin-bottom: 3px; }
  input {
    width: 100%;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    outline: none;
  }
  input:focus { border-color: var(--brand); }
  button {
    font: inherit;
    font-weight: 500;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg-2);
    color: var(--text);
    padding: 5px 10px;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.primary {
    width: 100%;
    margin-top: 7px;
    padding: 7px;
    background: var(--brand);
    border-color: transparent;
    color: var(--onbrand);
    font-size: 12px;
  }
  .actions { display: flex; gap: 5px; margin-top: 6px; }
  .actions button { flex: 1; padding: 5px 4px; white-space: nowrap; }
  .list-title { margin: 8px 0 3px; font-size: 10px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
  #filterBtn { font-size: 10px; padding: 0 4px; }
  #filterBtn.on { color: var(--brand); }
  .list { flex: 1 1 auto; min-height: 70px; overflow-y: auto; }
  .empty { color: var(--muted); font-size: 10px; padding: 8px 2px; }
  .card {
    margin-bottom: 6px;
    padding: 6px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-2);
  }
  .card .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .card .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta {
    color: var(--muted); font-size: 10px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .row-actions { display: flex; gap: 4px; margin-top: 5px; }
  .card .row-actions button { padding: 3px 7px; font-size: 10px; }
  .state { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; white-space: nowrap; }
  .state.done { color: var(--ok); }
  .state.bad { color: var(--danger); }
  .spinner {
    width: 8px; height: 8px; border-radius: 50%;
    border: 1.5px solid var(--border); border-top-color: var(--brand);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .log-title { margin: 7px 0 3px; font-size: 10px; color: var(--muted); }
  .log {
    flex: 1 1 auto;
    min-height: 60px;
    max-height: 40%;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 7px;
    background: var(--bg);
    font: 10px/1.55 ui-monospace, "SF Mono", Consolas, monospace;
    color: var(--muted);
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log b { color: var(--text); font-weight: 500; }
  .log .err { color: var(--danger); }

  /* ---- 折叠与紧凑布局（0.3.0） ---- */
  h1 { justify-content: flex-start; }
  h1 .grow { flex: 1 1 auto; }
  .icon-btn {
    border: 0; background: transparent; padding: 0 3px; cursor: pointer;
    color: var(--muted); font-size: 12px; line-height: 1; border-radius: 4px;
  }
  .icon-btn:hover { color: var(--text); background: var(--bg-2); }
  .topmore.collapsed { display: none; }
  .log.collapsed { display: none; }
  .psline {
    display: flex; align-items: center; gap: 4px;
    margin: 5px 0 0; font-size: 10px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .psline .live { color: var(--brand); font-weight: 600; }
  .log-title { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
  .log-title .chev { font-size: 9px; color: var(--muted); }
  .err-badge { color: var(--danger); margin-left: 4px; display: none; }
  .err-badge.on { display: inline; }
  .thumb {
    width: 34px; height: 34px; border-radius: 4px; flex: 0 0 auto;
    border: 1px solid var(--border); background: var(--bg);
    object-fit: cover; display: block;
  }
  .thumb.empty {
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px;
  }
  .card .row { align-items: flex-start; }
  .card .body { flex: 1 1 auto; min-width: 0; }
  .psbadge {
    display: inline-block; font-size: 9px; line-height: 1.5; padding: 0 4px;
    border-radius: 3px; margin-left: 4px; vertical-align: 1px;
    background: var(--brand); color: var(--onbrand);
  }
  .psbadge.soft { background: transparent; color: var(--muted); border: 1px solid var(--border); }

  /* ---- 最小化：缩成一条小横条，监听照常跑 ---- */
  #miniState {
    display: none;
    flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 10px; font-weight: 400; color: var(--muted);
  }
  body.min #miniState { display: block; }
  body.min h1 .grow { display: none; }
  body.min #settingsToggle { display: none; }
  body.min .topmore, body.min .psline, body.min #send, body.min .cropbar, body.min .actions,
  body.min .list-title, body.min .list, body.min .log-title, body.min .log { display: none; }
  body.min { padding: 9px 10px; }
  body.min h1 { cursor: pointer; }
  .cropbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 5px; font-size: 10px; color: var(--muted); gap: 6px;
  }
  .cropbar label { margin: 0; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .cropbar input[type="checkbox"] { width: 11px; height: 11px; padding: 0; cursor: pointer; }
  .cropbar .note { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <h1 id="titleBar">
    PS 桥接
    <span class="dot" id="bridgeDot"></span><span class="dot" id="psDot"></span>
    <span class="grow"></span>
    <span id="miniState"></span>
    <button class="icon-btn" id="settingsToggle" title="显示/隐藏说明与桥接地址">⚙</button>
    <button class="icon-btn" id="minToggle" title="收起面板（监听照常）">—</button>
  </h1>

  <div class="topmore collapsed" id="topMore">
    <p class="sub" id="hint">选中图片 → 发送到 PS → PS 里改完点「保存回传」</p>
    <label for="server">桥接服务地址</label>
    <input id="server" spellcheck="false" value="http://localhost:8765">
  </div>

  <div class="psline" id="psline">PS 状态未知</div>

  <button class="primary" id="send">发送选中到 PS</button>

  <div class="cropbar">
    <label><input type="checkbox" id="cropMode"> 裁剪模式</label>
    <label><input type="checkbox" id="newLayerMode"> 新建图层</label>
    <span class="note" id="cropNote">裁剪模式：发送 Figma 可见的原图裁剪区域</span>
  </div>

  <div class="actions">
    <button id="resume" title="把已停止/过期的任务重新加入监听">继续等待</button>
    <button id="clear" title="从列表里移除已停止、失败、过期的任务">清空已完成</button>
  </div>

  <div class="list-title">
    <span>任务 <span id="count">0</span></span>
    <button class="icon-btn" id="filterBtn" title="只显示 PS 里打开的任务">只看 PS 中</button>
  </div>
  <div class="list" id="list"></div>

  <div class="log-title" id="logTitle">
    <span>运行日志<span class="err-badge" id="logBadge">●</span></span>
    <span class="chev" id="logChev">▸</span>
  </div>
  <div class="log collapsed" id="log"></div>

<script>
(function () {
  var serverInput = document.getElementById('server');
  var sendBtn = document.getElementById('send');
  var resumeBtn = document.getElementById('resume');
  var clearBtn = document.getElementById('clear');
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var hintEl = document.getElementById('hint');
  var logEl = document.getElementById('log');
  var bridgeDot = document.getElementById('bridgeDot');
  var psDot = document.getElementById('psDot');
  var settingsToggle = document.getElementById('settingsToggle');
  var topMore = document.getElementById('topMore');
  var pslineEl = document.getElementById('psline');
  var logTitleEl = document.getElementById('logTitle');
  var logChev = document.getElementById('logChev');
  var logBadge = document.getElementById('logBadge');
  var filterBtn = document.getElementById('filterBtn');
  var titleBar = document.getElementById('titleBar');
  var minToggle = document.getElementById('minToggle');
  var miniState = document.getElementById('miniState');
  var cropModeEl = document.getElementById('cropMode');
  var newLayerModeEl = document.getElementById('newLayerMode');

  var selection = { count: 0, name: '' };
  // 与 bridge/server.py、ps-cep/js/main.js 保持一致
  var PORTS = [8765, 8766, 8767, 8768, 8769, 8770, 8771, 8772, 8773, 8774];
  var JOB_STATES = ['watching', 'done', 'stopped', 'failed', 'expired'];
  // 一次 watch 最多盯多少个任务（防止 ids 无限增长撑爆 URL）
  var MAX_WATCH_JOBS = 40;
  var RETRY_DELAYS = [2000, 4000, 8000, 15000, 30000];
  var MAX_APPLY_FAILURES = 3;      // 写回连续失败次数上限：同一条不可修复的错误不再无限退避（D4）
  var REGISTRY_TIMEOUT_MS = 4000;  // 等主线程 jobs 的超时：主线程异常时别把发送按钮永久卡死（D6）

  // 注册表：{version:2, fileKey, jobs:[{jobId, meta, at, appliedAt, state}]}
  var registry = { version: 2, fileKey: null, jobs: [] };
  var registryLoaded = false;
  var resolveRegistryReady = null;
  var registryReady = new Promise(function (resolve) { resolveRegistryReady = resolve; });

  var activeBase = null;      // 探测到的可用桥接服务地址
  var sending = false;        // 正在把选中图层发出去
  var uiStatus = {};          // jobId -> 临时状态文案（取回结果、重试中等）
  var retryState = {};        // jobId -> {count, timer, updatedAt}
  var applyFailures = {};     // jobId -> 写回连续失败次数（到上限就放弃）
  var applying = {};          // jobId -> 正在回写
  var pendingApply = {};      // jobId -> {resolve}：等主线程 apply-done
  var lastFailure = {};       // jobId -> 已提示过的 failed updatedAt
  var coordinatorStarted = false;

  // 插件 iframe 里 localStorage 可能抛 SecurityError，降级到内存
  var memoryStore = {};
  var store = {
    get: function (k) {
      try { return localStorage.getItem(k); } catch (e) { return k in memoryStore ? memoryStore[k] : null; }
    },
    set: function (k, v) {
      try { localStorage.setItem(k, v); } catch (e) { memoryStore[k] = v; }
    }
  };

  // Figma 的 networkAccess 不允许 IP 字面量，统一用 localhost
  serverInput.value = (store.get('ps-bridge-server') || 'http://localhost:8765').replace('127.0.0.1', 'localhost');
  serverInput.addEventListener('change', function () {
    store.set('ps-bridge-server', server());
  });
  // 裁剪模式开关：开启后发 Figma 画布上看到的样子（含裁切、透明度等），不是完整原图
  cropModeEl.checked = store.get('ps-bridge-crop-mode') === '1';
  cropModeEl.addEventListener('change', function () {
    store.set('ps-bridge-crop-mode', cropModeEl.checked ? '1' : '0');
  });
  // 新建模式：回传时新建画框容纳 PS 结果，原图层隐藏不丢；每次发送时决定
  newLayerModeEl.checked = store.get('ps-bridge-new-layer') === '1';
  newLayerModeEl.addEventListener('change', function () {
    store.set('ps-bridge-new-layer', newLayerModeEl.checked ? '1' : '0');
  });

  // ---------------- 面板折叠（顶部信息 / 运行日志） ----------------
  // 目标：把屏幕尽量留给任务列表。默认都收起，用户开合状态持久化。

  var topOpen = store.get('ps-bridge-top-open') === '1';
  var logOpen = store.get('ps-bridge-log-open') === '1';

  function applyTopOpen() {
    topMore.className = 'topmore' + (topOpen ? '' : ' collapsed');
    settingsToggle.textContent = topOpen ? '×' : '⚙';
    settingsToggle.title = topOpen ? '收起说明与地址' : '显示说明与桥接地址';
  }

  function applyLogOpen() {
    logEl.className = 'log' + (logOpen ? '' : ' collapsed');
    logChev.textContent = logOpen ? '▾' : '▸';
    if (logOpen) logBadge.className = 'err-badge';
  }

  settingsToggle.addEventListener('click', function () {
    topOpen = !topOpen;
    store.set('ps-bridge-top-open', topOpen ? '1' : '0');
    applyTopOpen();
  });

  logTitleEl.addEventListener('click', function () {
    logOpen = !logOpen;
    store.set('ps-bridge-log-open', logOpen ? '1' : '0');
    applyLogOpen();
  });

  applyTopOpen();
  applyLogOpen();

  // ---------------- 最小化：缩成一条小横条 ----------------
  // 收起只是视觉上的：协调器/长轮询在 iframe 里照常跑，PS 回传仍会自动贴回。
  // 宽高由主线程 ui-resize 决定；开合状态持久化，重开面板保持上次的样子。

  var minimized = store.get('ps-bridge-min') === '1';

  function updateMiniState() {
    if (!minimized) return;
    var text;
    if (sending) {
      text = '发送中…';
    } else {
      var n = 0;
      for (var i = 0; i < registry.jobs.length; i++) {
        if (isListening(registry.jobs[i])) n++;
      }
      text = n ? n + ' 个监听中' : '空闲';
    }
    if (miniState.textContent !== text) miniState.textContent = text;
  }

  function applyMin() {
    document.body.className = minimized ? 'min' : '';
    minToggle.textContent = minimized ? '▢' : '—';
    minToggle.title = minimized ? '展开面板' : '收起面板（监听照常）';
    updateMiniState();
    parent.postMessage({ pluginMessage: { type: 'ui-resize', minimized: minimized } }, '*');
  }

  minToggle.addEventListener('click', function (event) {
    event.stopPropagation();
    minimized = !minimized;
    store.set('ps-bridge-min', minimized ? '1' : '0');
    applyMin();
  });

  // 收起时点横条任意位置即可展开
  titleBar.addEventListener('click', function () {
    if (!minimized) return;
    minimized = false;
    store.set('ps-bridge-min', '0');
    applyMin();
  });

  applyMin();

  // ---------------- PS 现场状态（只读） ----------------
  // 桥接服务把 PS 面板上报的 {activeJobId, openJobIds} 透传过来，
  // 让 Figma 侧知道“PS 里开着哪几张、现在正在看哪一张”。

  var psState = { online: false, activeJobId: null, openJobIds: [], updatedAt: 0, supported: false };

  // 列表过滤：默认只显示「PS 里开着的」任务，避免记录越攒越多把列表占满。
  // 还没贴回过的新任务会保留显示（PS 打开它可能有 2 秒延迟）。
  var onlyOpen = store.get('ps-bridge-only-open') !== '0';
  var filterActive = false;

  function filterUsable() {
    return onlyOpen && psState.online && psState.supported;
  }

  // 刚发出去、PS 还没接手时的缓冲时间：超过就按「PS 里开着」判断
  var SEND_GRACE_MS = 60000;

  function visibleJobs() {
    var all = registry.jobs;
    if (!filterActive) return all;
    var open = psState.openJobIds;
    var now = Date.now();
    var out = [];
    for (var i = 0; i < all.length; i++) {
      var entry = all[i];
      if (open.indexOf(entry.jobId) >= 0) { out.push(entry); continue; }
      // 刚发出去、PS 还没打开：给 60 秒缓冲，避免点完发送任务就“消失”。
      // 一旦 PS 打开过（seenOpen）又关掉，就不再占着列表（v0.3.3）。
      if (!entry.appliedAt && !entry.seenOpen && (now - (entry.at || 0)) < SEND_GRACE_MS) {
        out.push(entry);
      }
    }
    return out;
  }

  function renderFilterBtn() {
    if (nonFilterable()) {
      filterBtn.textContent = '显示全部';
      filterBtn.className = 'icon-btn';
      filterBtn.disabled = true;
      filterBtn.title = 'PS 面板未连接（或版本过旧），无法按「PS 里打开」过滤';
      return;
    }
    filterBtn.disabled = false;
    filterBtn.textContent = onlyOpen ? '只看 PS 中' : '显示全部';
    filterBtn.className = 'icon-btn' + (onlyOpen ? ' on' : '');
    filterBtn.title = onlyOpen
      ? '当前只显示 PS 里打开的任务；点一下显示全部记录'
      : '当前显示全部记录；点一下只显示 PS 里打开的任务';
  }

  function nonFilterable() {
    return !psState.online || !psState.supported;
  }

  filterBtn.addEventListener('click', function () {
    onlyOpen = !onlyOpen;
    store.set('ps-bridge-only-open', onlyOpen ? '1' : '0');
    filterActive = filterUsable();
    renderList();
  });

  function applyPsState(ps) {
    if (!ps || typeof ps !== 'object') return;
    var open = Array.isArray(ps.openJobIds) ? ps.openJobIds.slice() : [];
    var active = ps.activeJobId || null;
    var changed = !!ps.online !== psState.online ||
      active !== psState.activeJobId ||
      open.join(',') !== psState.openJobIds.join(',');

    var supported = psState.supported || open.length > 0 || (Number(ps.updatedAt) || 0) > 0;

    psState = {
      online: !!ps.online,
      activeJobId: active,
      openJobIds: open,
      updatedAt: Number(ps.updatedAt) || 0,
      supported: supported
    };

    psDot.className = 'dot ' + (psState.online ? 'on' : 'bad');
    psDot.title = psState.online ? 'PS 面板在线' : 'PS 面板未连接';

    // 记住「PS 确实打开过它」：之后它被关掉就不该再靠缓冲期占着列表
    for (var k = 0; k < open.length; k++) {
      var openedEntry = findJob(open[k]);
      if (openedEntry) openedEntry.seenOpen = true;
    }

    renderPsLine();
    var nextFilterActive = filterUsable();
    var filterChanged = nextFilterActive !== filterActive;
    filterActive = nextFilterActive;
    renderFilterBtn();
    if (changed || filterChanged) renderList();
  }

  function renderPsLine() {
    if (!psState.online) {
      pslineEl.textContent = 'PS 面板未连接';
      pslineEl.title = 'PS 里没打开「Figma 桥接」面板，Figma 无法知道 PS 那边的情况';
      return;
    }
    var entry = psState.activeJobId ? findJob(psState.activeJobId) : null;
    var text;
    var live = false;
    if (entry) {
      text = 'PS 正在看：' + nameOf(entry.meta);
      live = true;
    } else if (psState.openJobIds.length) {
      text = 'PS 里开着 ' + psState.openJobIds.length + ' 张（当前文档没有任务标记）';
    } else {
      text = 'PS 空闲';
    }
    pslineEl.textContent = '';
    if (live) {
      var dot = document.createElement('span');
      dot.className = 'live';
      dot.textContent = '◆';
      pslineEl.appendChild(dot);
      pslineEl.appendChild(document.createTextNode(' ' + text));
    } else {
      pslineEl.appendChild(document.createTextNode(text));
    }
    pslineEl.title = text;
  }

  // 面板有焦点时刷得快，切到后台降频（用户选的“自适应”节奏）
  function idleDelay() {
    var focused = true;
    try { focused = document.hasFocus ? document.hasFocus() : true; } catch (e) { focused = true; }
    return focused ? 3000 : 15000;
  }

  function server() {
    return (serverInput.value || 'http://localhost:8765').trim().replace(/\/+$/, '');
  }

  function log(text, isError) {
    var line = document.createElement('div');
    line.className = isError ? 'err' : '';
    var time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    line.innerHTML = '<b>' + time + '</b>  ' + escapeHtml(text);
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    // 日志收起时用小红点提示「有新错误」，避免把错误藏起来
    if (isError && !logOpen) logBadge.className = 'err-badge on';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
  }

  function sleep(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  function nameOf(meta) {
    return (meta && (meta.nodeName || meta.targetName)) || '未命名';
  }

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function bytesToB64(bytes) {
    var chunk = 0x8000;
    var parts = [];
    for (var i = 0; i < bytes.length; i += chunk) {
      parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + chunk)));
    }
    return btoa(parts.join(''));
  }

  /** 把源图 base64 缩成 68px 以内的 PNG data URL；失败返回空串（绝不影响发送） */
  function makeThumb(b64) {
    return new Promise(function (resolve) {
      var done = false;
      function finish(value) {
        if (done) return;
        done = true;
        resolve(value || '');
      }
      try {
        var img = new Image();
        img.onload = function () {
          try {
            var max = 68; // 34px 显示 @2x
            var scale = Math.min(max / (img.width || 1), max / (img.height || 1), 1);
            var w = Math.max(1, Math.round((img.width || 1) * scale));
            var h = Math.max(1, Math.round((img.height || 1) * scale));
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            finish(canvas.toDataURL('image/png'));
          } catch (e) {
            finish('');
          }
        };
        img.onerror = function () { finish(''); };
        img.src = 'data:image/png;base64,' + b64;
      } catch (e) {
        finish('');
        return;
      }
      setTimeout(function () { finish(''); }, 3000); // 解码卡住时的兜底
    });
  }

  // ---------------- 注册表 ----------------

  /** 主线程遇到 Figma 单图单边超限时，让我们把图缩到 maxSide 以内再回传 base64 */
  function handleDownscale(msg) {
    var b64 = msg.data || '';
    var maxSide = Number(msg.maxSide) || 4096;
    function reply(value) {
      parent.postMessage({ pluginMessage: { type: 'downscale-result', key: msg.key, data: value || '' } }, '*');
    }
    try {
      var img = new Image();
      img.onload = function () {
        try {
          var scale = Math.min(maxSide / (img.width || 1), maxSide / (img.height || 1), 1);
          var w = Math.max(1, Math.round((img.width || 1) * scale));
          var h = Math.max(1, Math.round((img.height || 1) * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          reply(canvas.toDataURL('image/png').replace(/^data:image\/\w+;base64,/, ''));
        } catch (e) {
          reply('');
        }
      };
      img.onerror = function () { reply(''); };
      img.src = 'data:image/png;base64,' + b64;
    } catch (e) {
      reply('');
    }
  }

  function normalizeValue(value) {
    var jobs = [];
    var seen = {};
    var list = value && Array.isArray(value.jobs) ? value.jobs : [];
    for (var i = 0; i < list.length; i++) {
      var raw = list[i];
      if (!raw || !raw.jobId || seen[raw.jobId]) continue;
      seen[raw.jobId] = true;
      jobs.push({
        jobId: String(raw.jobId),
        meta: raw.meta && typeof raw.meta === 'object' ? raw.meta : {},
        at: Number(raw.at) || 0,
        appliedAt: Number(raw.appliedAt) || 0,
        state: JOB_STATES.indexOf(raw.state) >= 0 ? raw.state : 'watching',
        blockedAt: Number(raw.blockedAt) || 0,
        thumb: typeof raw.thumb === 'string' ? raw.thumb : ''
      });
    }
    return {
      version: 2,
      fileKey: value && typeof value.fileKey === 'string' ? value.fileKey : null,
      jobs: jobs
    };
  }

  function saveRegistry() {
    parent.postMessage({ pluginMessage: { type: 'save-jobs', value: registry } }, '*');
  }

  function findJob(jobId) {
    for (var i = 0; i < registry.jobs.length; i++) {
      if (registry.jobs[i].jobId === jobId) return registry.jobs[i];
    }
    return null;
  }

  function findActiveByTargetId(targetId) {
    if (!targetId) return null;
    for (var i = 0; i < registry.jobs.length; i++) {
      var entry = registry.jobs[i];
      if (entry.state === 'watching' && entry.meta && entry.meta.targetId === targetId) return entry;
    }
    return null;
  }

  // ---------------- 渲染 ----------------

  function statusText(entry) {
    if (uiStatus[entry.jobId]) return uiStatus[entry.jobId];
    if (entry.state === 'done') return '已回写 · 仍在监听';
    if (entry.state === 'stopped') {
      return entry.appliedAt ? '已停止监听 · 可再传' : '已取消 · 可继续等待恢复';
    }
    if (entry.state === 'failed') return '失败 · 有新结果会自动再试';
    if (entry.state === 'expired') return '任务过期 · 仍可认出原图层';
    return entry.appliedAt ? '已回写 · 守着这个图层' : '等待 PS 编辑';
  }

  // 仍在监听 = 桥接上之后可能还会有新结果。
  // 只有两种明确「不要再管」的状态除外：
  //   stopped —— 用户在 Figma 里主动点了「停止」
  //   expired —— 桥接上记录已经不存在
  // 特别注意 failed 必须继续监听：PS 面板「取消任务」会把任务置 failed，
  // 用户之后重开 PSD 再点「保存并回传」，必须能自动贴回，
  // 否则就会出现「PS 允许你传、Figma 却拒收」的自相矛盾（v0.2.2 修复）。
  function isListening(entry) {
    return !!entry && entry.state !== 'stopped' && entry.state !== 'expired';
  }

  function stateClass(entry) {
    if (entry.state === 'done') return 'state done';
    if (entry.state === 'failed' || entry.state === 'expired') return 'state bad';
    return 'state';
  }

  function psBadgeFor(jobId) {
    if (!psState.online) return null;
    if (psState.activeJobId === jobId) return { text: '◆ PS 正在看', cls: 'psbadge' };
    if (psState.openJobIds.indexOf(jobId) >= 0) return { text: 'PS 已打开', cls: 'psbadge soft' };
    return null;
  }

  function renderRow(entry) {
    var card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('data-job', entry.jobId);

    var row = document.createElement('div');
    row.className = 'row';

    // 缩略图：发送时生成并存进注册表，面板重开/插件重跑后仍在
    if (entry.thumb && entry.thumb !== 'none') {
      var img = document.createElement('img');
      img.className = 'thumb';
      img.src = entry.thumb;
      img.alt = '';
      row.appendChild(img);
    } else {
      var ph = document.createElement('div');
      ph.className = 'thumb empty';
      ph.textContent = '▢';
      ph.title = entry.thumb === 'none'
        ? '原图层已不在，无法生成缩略图'
        : '正在生成缩略图…';
      row.appendChild(ph);
    }

    var body = document.createElement('div');
    body.className = 'body';

    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = nameOf(entry.meta);
    name.title = name.textContent;

    var badge = psBadgeFor(entry.jobId);
    if (badge) {
      var badgeEl = document.createElement('span');
      badgeEl.className = badge.cls;
      badgeEl.textContent = badge.text;
      name.appendChild(badgeEl);
    }

    var meta = entry.meta || {};
    var metaLine = document.createElement('div');
    metaLine.className = 'meta';
    metaLine.textContent = (meta.imageWidth || '?') + '×' + (meta.imageHeight || '?') + ' px · 画布 ' +
      (meta.nodeWidth || '?') + '×' + (meta.nodeHeight || '?') + ' · ' + entry.jobId;
    metaLine.title = metaLine.textContent;

    body.appendChild(name);
    body.appendChild(metaLine);

    var state = document.createElement('span');
    state.className = stateClass(entry);
    if (entry.state === 'watching' && (!entry.appliedAt || uiStatus[entry.jobId])) {
      // 还在等 PS 或正在取回/重试：转个圈
      var spinner = document.createElement('span');
      spinner.className = 'spinner';
      state.appendChild(spinner);
    }
    state.appendChild(document.createTextNode(statusText(entry)));

    row.appendChild(body);
    row.appendChild(state);

    var actions = document.createElement('div');
    actions.className = 'row-actions';

    var locate = document.createElement('button');
    locate.textContent = '认出原图层';
    locate.disabled = !(meta.targetId);
    locate.addEventListener('click', function () { locateEntry(entry.jobId); });

    var stop = document.createElement('button');
    stop.textContent = '停止';
    stop.disabled = !isListening(entry);
    stop.addEventListener('click', function () { stopEntry(entry.jobId); });

    actions.appendChild(locate);
    actions.appendChild(stop);

    card.appendChild(row);
    card.appendChild(actions);
    return card;
  }

  function renderList() {
    var scrollTop = listEl.scrollTop;
    listEl.textContent = '';

    var shown = visibleJobs();
    var total = registry.jobs.length;
    countEl.textContent = filterActive ? (shown.length + ' / ' + total) : String(total);
    renderFilterBtn();
    updateMiniState();

    if (!shown.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = (filterActive && total)
        ? 'PS 里没有打开的任务。点上面的「显示全部」可以看到 ' + total + ' 条历史记录。'
        : '还没有任务。选中图层后点上面的按钮发送。';
      listEl.appendChild(empty);
      listEl.scrollTop = scrollTop;
      return;
    }
    var frag = document.createDocumentFragment();
    for (var i = 0; i < shown.length; i++) {
      frag.appendChild(renderRow(shown[i]));
    }
    listEl.appendChild(frag);
    listEl.scrollTop = scrollTop;
    requestMissingThumbs();
  }

  // 老任务没有缩略图时，请主线程按目标节点重新渲染一张小的补上（一次最多 3 个，免得一次导出太多）
  var thumbRequested = {};

  function requestMissingThumbs() {
    var budget = 3;
    for (var i = 0; i < registry.jobs.length && budget > 0; i++) {
      var entry = registry.jobs[i];
      if (entry.thumb) continue; // 已有图，或已确认拿不到（'none'）
      if (thumbRequested[entry.jobId]) continue;
      thumbRequested[entry.jobId] = true;
      budget--;
      parent.postMessage({
        pluginMessage: {
          type: 'thumb-request',
          jobId: entry.jobId,
          targetId: (entry.meta || {}).targetId || ''
        }
      }, '*');
    }
  }

  function setStatus(jobId, text) {
    if (!findJob(jobId)) return;
    uiStatus[jobId] = text;
    renderList();
  }

  function clearStatus(jobId) {
    if (!(jobId in uiStatus)) return;
    delete uiStatus[jobId];
    renderList();
  }

  function renderSendButton() {
    sendBtn.disabled = sending;
    sendBtn.textContent = sending
      ? '发送中…'
      : (selection.count ? '发送 ' + selection.count + ' 个到 PS' : '发送选中到 PS');
    updateMiniState();
  }

  // ---------------- 端口探测 / 健康检查 ----------------

  /** 依次探测候选端口，找到可用的桥接服务就返回 { base, data } */
  async function findServer() {
    var bases = [server()];
    for (var i = 0; i < PORTS.length; i++) {
      var candidate = 'http://localhost:' + PORTS[i];
      if (bases.indexOf(candidate) === -1) bases.push(candidate);
    }

    for (var j = 0; j < bases.length; j++) {
      try {
        var res = await fetch(bases[j] + '/api/health', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        if (!data || !data.ok) throw new Error('不是桥接服务');
        return { base: bases[j], data: data };
      } catch (err) {
        // 端口不通或不是我们的服务，继续试下一个
      }
    }
    return null;
  }

  async function ensureBase() {
    var found = await findServer();
    if (!found) {
      activeBase = null;
      return null;
    }
    if (found.base !== server()) {
      serverInput.value = found.base;
      store.set('ps-bridge-server', found.base);
      log('已连接到桥接服务 ' + found.base);
    }
    activeBase = found.base;
    return activeBase;
  }

  async function checkHealth() {
    // 桥接服务会自动避开被占用的端口（比如 8765 被代理软件占了），这里依次试
    var found = await findServer();
    if (!found) {
      bridgeDot.className = 'dot bad';
      activeBase = null;
      applyPsState({ online: false, activeJobId: null, openJobIds: [], updatedAt: 0 });
      return;
    }

    if (found.base !== server()) {
      serverInput.value = found.base;
      store.set('ps-bridge-server', found.base);
      log('已连接到桥接服务 ' + found.base);
    }
    activeBase = found.base;

    bridgeDot.className = 'dot on';
    applyPsState(found.data.ps || {
      online: !!found.data.psOnline,
      activeJobId: null,
      openJobIds: [],
      updatedAt: 0
    });
  }

  // ---------------- 发送（支持多选） ----------------

  async function uploadOne(base, item) {
    var meta = (item && item.meta) || {};
    var data = item && item.data;
    var displayName = nameOf(meta);
    if (!data) throw new Error('源图数据为空');
    if (findActiveByTargetId(meta.targetId)) {
      log('「' + displayName + '」已在处理中，已跳过', true);
      return;
    }

    var finalMeta = Object.assign({}, meta, { client: 'figma' });
    var res = await fetch(base + '/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(finalMeta)
    });
    if (!res.ok) throw new Error('创建任务失败 ' + res.status);
    var created = await res.json();

    var blob = new Blob([b64ToBytes(data)], { type: 'image/png' });
    var put = await fetch(base + '/api/jobs/' + created.id + '/image', {
      method: 'PUT',
      headers: { 'Content-Type': 'image/png' },
      body: blob
    });
    if (!put.ok) {
      fetch(base + '/api/jobs/' + created.id + '/fail', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ error: 'Figma 端上传失败' })
      }).catch(function () {});
      throw new Error('上传失败 ' + put.status);
    }

    var thumb = await makeThumb(data);

    registry.jobs.push({
      jobId: created.id,
      meta: finalMeta,
      at: Date.now(),
      appliedAt: 0,
      state: 'watching',
      thumb: thumb
    });
    saveRegistry();
    renderList();
    log('任务 ' + created.id + ' 已发送（' + displayName + '）');
  }

  async function handleSendPayloads(items) {
    try {
      if (!items.length) {
        log('没有需要发送的图层', true);
        return;
      }
      var ready = await waitRegistry();
      if (!ready) {
        // 主线程一直没回 jobs：解除 busy，别让按钮永久 disabled（D6）
        log('读取任务列表超时，请重开面板', true);
        return;
      }
      var base = await ensureBase();
      if (!base) {
        log('找不到桥接服务。请确认已双击运行「启动桥接.bat」', true);
        return;
      }
      var done = 0;
      var failed = 0;
      for (var i = 0; i < items.length; i++) {
        try {
          await uploadOne(base, items[i]);
          done++;
        } catch (err) {
          failed++;
          log('「' + nameOf(items[i] && items[i].meta) + '」发送失败：' + err.message, true);
        }
      }
      log('已发送 ' + done + ' 个任务' + (failed ? '，失败 ' + failed + ' 个' : '') + '，等待 PS 回传');
    } finally {
      sending = false;
      renderSendButton();
      startCoordinator();
    }
  }

  /** 等注册表：最多 REGISTRY_TIMEOUT_MS 毫秒，超时返回 false（主线程异常时不阻塞发送流程） */
  function waitRegistry() {
    return new Promise(function (resolve) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        resolve(false);
      }, REGISTRY_TIMEOUT_MS);
      registryReady.then(function () {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        resolve(true);
      });
    });
  }

  // ---------------- 协调器：批量长轮询 + 串行回写 ----------------

  function startCoordinator() {
    if (coordinatorStarted) return;
    coordinatorStarted = true;
    (async function loop() {
      while (true) {
        try {
          await coordinatorStep();
        } catch (err) {
          log('监听循环出错：' + err.message, true);
          await sleep(2000);
        }
      }
    })();

    // PS 单方面发来的图：单独轮询（主循环的长轮询会挂 25 秒，发现太慢）
    (async function discoverLoop() {
      while (true) {
        try {
          var base = activeBase || (await ensureBase());
          if (base) await discoverPsJobs(base);
        } catch (err) {
          // 忽略，下一轮再试
        }
        await sleep(3000);
      }
    })();
  }

  async function coordinatorStep() {
    var watching = registry.jobs.filter(isListening);
    // 只盯最近活跃的若干个，防止 watch 的 ids 无限增长
    watching.sort(function (a, b) {
      return (b.appliedAt || b.at || 0) - (a.appliedAt || a.at || 0);
    });
    watching = watching.slice(0, MAX_WATCH_JOBS);
    if (!watching.length) {
      // 没有在等的任务：降级成健康检查，顺便把连接指示灯和 PS 现场状态刷新
      await checkHealth();
      await sleep(idleDelay());
      return;
    }

    var base = await ensureBase();
    if (!base) {
      await sleep(5000);
      return;
    }

    var ids = watching.map(function (entry) { return entry.jobId; });
    var roundStart = Date.now();
    var payload;
    try {
      var res = await fetch(base + '/api/jobs/watch?ids=' + encodeURIComponent(ids.join(',')) + '&wait=25', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      payload = await res.json();
    } catch (err) {
      // 网络错误（或桥接服务还没这版接口）→ 重新探测端口，稍后再试
      activeBase = null;
      bridgeDot.className = 'dot bad';
      applyPsState({ online: false, activeJobId: null, openJobIds: [], updatedAt: 0 });
      await sleep(2000);
      return;
    }

    bridgeDot.className = 'dot on';
    applyPsState(payload && payload.ps);
    var list = payload && Array.isArray(payload.jobs) ? payload.jobs : [];
    var seen = {};
    for (var i = 0; i < list.length; i++) {
      var remote = list[i];
      if (!remote || !remote.id) continue;
      seen[remote.id] = true;
      dispatchRemote(base, remote);
    }
    // watch 会省略不存在的 id（契约 4.3）：剩下的就是已过期，保留 targetId 供「认出原图层」
    for (var j = 0; j < ids.length; j++) {
      if (!seen[ids[j]]) markExpired(ids[j]);
    }

    // 正常 watch 会挂满 25 秒；万一桥接端立即返回（异常/旧实现），这里限个速，别把面板转成热循环
    var elapsed = Date.now() - roundStart;
    if (elapsed < 300) await sleep(300 - elapsed);
  }

  function dispatchRemote(base, remote) {
    var entry = findJob(remote.id);
    if (!entry) return;
    var updatedAt = Number(remote.updatedAt) || 0;

    if (remote.status === 'ready') {
      if (updatedAt > (entry.appliedAt || 0) && updatedAt > (entry.blockedAt || 0)) {
        // 来了比已贴版本更新的结果：不管之前是正常等待、还是被 PS 取消/失败过，
        // 都重置熔断计数并恢复监听 —— 「取消」只该停 PS 那边的会话，不是永久拒收
        if (entry.state === 'failed') {
          entry.state = 'watching';
          delete lastFailure[entry.jobId];
          log('任务 ' + entry.jobId + ' 收到新结果，已自动恢复监听');
        }
        if (entry.lastApplyTarget !== updatedAt) {
          entry.lastApplyTarget = updatedAt;
          delete applyFailures[entry.jobId];
          resetRetry(entry.jobId);
        }
        saveRegistry();
        renderList();
        attemptApply(base, entry.jobId, updatedAt);
      }
      return;
    }

    if (remote.status === 'done') {
      entry.state = 'done';
      if (updatedAt > (entry.appliedAt || 0)) entry.appliedAt = updatedAt;
      cancelRetry(entry.jobId);
      delete uiStatus[entry.jobId];
      saveRegistry();
      renderList();
      return;
    }

    if (remote.status === 'failed') {
      entry.state = 'failed';
      cancelRetry(entry.jobId);
      delete uiStatus[entry.jobId];
      if (lastFailure[entry.jobId] !== updatedAt) {
        lastFailure[entry.jobId] = updatedAt;
        log('任务 ' + entry.jobId + ' 失败：' + (remote.error || 'PS 端处理失败'), true);
      }
      saveRegistry();
      renderList();
    }
    // awaiting-image / pending / editing → 继续等
  }

  function markExpired(jobId) {
    var entry = findJob(jobId);
    if (!isListening(entry)) return;
    entry.state = 'expired';
    cancelRetry(jobId);
    delete uiStatus[jobId];
    log('任务 ' + jobId + ' 已不在桥接服务里（可能已过期）；仍可用「认出原图层」', true);
    saveRegistry();
    renderList();
  }

  /** 主线程写回：postMessage apply-result（必须带 jobId），等 apply-done 回执 */
  function sendApply(jobId, meta, buffer) {
    return new Promise(function (resolve) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        delete pendingApply[jobId];
        resolve({ ok: false, error: '主线程写回超时' });
      }, 60000);
      pendingApply[jobId] = {
        resolve: function (result) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          delete pendingApply[jobId];
          resolve(result);
        }
      };
      parent.postMessage({
        pluginMessage: {
          type: 'apply-result',
          jobId: jobId,
          reveal: true,
          meta: {
            targetId: meta.targetId,
            targetName: meta.targetName,
            paintIndex: meta.paintIndex,
            fallback: meta.fallback,
            mode: meta.mode,
            newLayer: meta.newLayer,
            multiImage: meta.multiImage,
            resultLayerId: meta.resultLayerId,
            imageWidth: meta.imageWidth,
            imageHeight: meta.imageHeight,
            nodeWidth: meta.nodeWidth,
            nodeHeight: meta.nodeHeight
          },
          data: bytesToB64(new Uint8Array(buffer))
        }
      }, '*');
    });
  }

  /** PS 主动发来的图：主线程在选中图层上方新建一个图层 */
  function sendInsert(jobId, meta, buffer) {
    return new Promise(function (resolve) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        delete pendingApply[jobId];
        resolve({ ok: false, error: '主线程新建图层超时' });
      }, 60000);
      pendingApply[jobId] = {
        resolve: function (result) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          delete pendingApply[jobId];
          resolve(result);
        }
      };
      parent.postMessage({
        pluginMessage: {
          type: 'insert-result',
          jobId: jobId,
          meta: { name: meta.name || meta.targetName || 'PS 图片' },
          data: bytesToB64(new Uint8Array(buffer))
        }
      }, '*');
    });
  }

  // ---------------- PS 主动发来的图：发现 + 新建图层 ----------------

  var inserting = false;
  // PS 单方面发来的图多久还算「有效」（插件重开时不贴陈年老图）
  var PS_INSERT_MAX_AGE_MS = 10 * 60 * 1000;

  /**
   * PS 面板可以「单方面」把一张自己打开的图发到桥接服务（meta.source='ps'）。
   * 这类任务不在本地注册表里，所以单独扫一遍：ready 且没处理过的就新建一个图层。
   */
  async function discoverPsJobs(base) {
    if (inserting) return;
    inserting = true;
    try {
      var res = await fetch(base + '/api/jobs', { cache: 'no-store' });
      if (!res.ok) return;
      var data = await res.json();
      var list = (data && data.jobs) || [];
      for (var i = 0; i < list.length; i++) {
        var job = list[i];
        if (!job || !job.meta || job.meta.source !== 'ps') continue;
        if (job.status !== 'ready') continue;
        if (findJob(job.id)) continue;
        // 只接刚发来的：插件重开时不要把很久以前的图悄悄贴进画布
        if (Date.now() - (Number(job.createdAt) || 0) > PS_INSERT_MAX_AGE_MS) continue;
        await insertOne(base, job);
      }
    } catch (err) {
      // 网络抖动忽略，下一轮再扫
    } finally {
      inserting = false;
    }
  }

  async function insertOne(base, job) {
    var updatedAt = Number(job.updatedAt) || 0;
    var rr;
    try {
      rr = await fetch(base + '/api/jobs/' + job.id + '/result', { cache: 'no-store' });
    } catch (err) {
      return;
    }
    if (!rr.ok) return;
    var buf = await rr.arrayBuffer();
    var reply = await sendInsert(job.id, job.meta || {}, buf);

    if (!reply.ok) {
      log('PS 主动发来的「' + (job.meta.name || '图片') + '」新建失败：' + (reply.error || '未知原因'), true);
      // 标记失败，免得每轮都重试
      fetch(base + '/api/jobs/' + job.id + '/fail', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ error: 'Figma 端新建图层失败：' + (reply.error || '未知原因') })
      }).catch(function () {});
      return;
    }

    // 登记进注册表：用户能在列表里看到这条，但不再监听（已经贴完了）
    registry.jobs.push({
      jobId: job.id,
      meta: Object.assign({}, job.meta, { mode: 'insert', nodeName: job.meta.name || 'PS 图片' }),
      at: Number(job.createdAt) || Date.now(),
      appliedAt: updatedAt,
      state: 'done',
      blockedAt: 0,
      thumb: 'none'
    });
    saveRegistry();
    renderList();
    log('已按 PS 发来的「' + (job.meta.name || '图片') + '」新建图层（' +
      (job.meta.imageWidth || '?') + '×' + (job.meta.imageHeight || '?') + '）');
    await ackResult(base, job.id, updatedAt);
  }

  async function attemptApply(base, jobId, updatedAt) {
    var entry = findJob(jobId);
    if (!isListening(entry)) return;
    if (applying[jobId]) return;
    var retry = retryState[jobId];
    if (retry && retry.timer) return;

    applying[jobId] = true;
    setStatus(jobId, '取回结果…');
    try {
      var rr;
      try {
        rr = await fetch(base + '/api/jobs/' + jobId + '/result', { cache: 'no-store' });
      } catch (err) {
        activeBase = null;
        throw new Error('取回结果失败：' + err.message);
      }
      if (rr.status === 404) {
        markExpired(jobId);
        return;
      }
      if (!rr.ok) throw new Error('取回结果失败 ' + rr.status);

      var buf = await rr.arrayBuffer();
      setStatus(jobId, '写回图层…');
      var reply = await sendApply(jobId, entry.meta || {}, buf);

      if (!reply.ok) {
        var reason = reply.error || '写回失败';
        if (reason.indexOf('任务已失效') >= 0) {
          entry.state = 'failed';
          delete uiStatus[jobId];
          log('任务 ' + jobId + ' 已不在注册表里，停止回写', true);
          saveRegistry();
          renderList();
          return;
        }
        applyFailures[jobId] = (applyFailures[jobId] || 0) + 1;
        if (reply.permanent) {
          // 图层被删、图太大这类错误重试也不会好：只提示一次，之后同一版结果不再尝试
          entry.state = 'failed';
          entry.blockedAt = updatedAt || 0;
          delete uiStatus[jobId];
          delete applyFailures[jobId];
          cancelRetry(jobId);
          saveRegistry();
          renderList();
          log(
            '任务 ' + jobId + ' 写回失败，已停止自动重试：' + reason +
              '（PS 里再传一次新结果会自动重试；原图层删掉了就取消这个任务）',
            true
          );
          return;
        }
        if (applyFailures[jobId] >= MAX_APPLY_FAILURES) {
          // 同一条不可修复的错误（例如 fallback 的容器拒绝 appendChild）不再无限退避（D4）
          entry.state = 'failed';
          entry.blockedAt = updatedAt || 0; // 这一版结果不再自动重试，等 PS 传新结果
          delete uiStatus[jobId];
          cancelRetry(jobId);
          saveRegistry();
          renderList();
          log(
            '任务 ' + jobId + ' 连续 ' + applyFailures[jobId] + ' 次写回失败，已停止重试：' + reason +
              '；重新回传即可自动重试',
            true
          );
          return;
        }
        throw new Error(reason);
      }

      // 只有主线程确认写回成功，appliedAt 才前移，才 ack
      entry.appliedAt = updatedAt || Date.now();
      delete uiStatus[jobId];
      delete applyFailures[jobId];
      saveRegistry();
      renderList();
      log('已回写任务 ' + jobId + '（' + nameOf(entry.meta) + '）');
      resetRetry(jobId);
      await ackResult(base, jobId, updatedAt);
    } catch (err) {
      scheduleRetry(jobId, updatedAt, err.message || String(err));
    } finally {
      delete applying[jobId];
    }
  }

  async function ackResult(base, jobId, updatedAt, attempt) {
    attempt = attempt || 0;
    try {
      var res = await fetch(base + '/api/jobs/' + jobId + '/ack', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ updatedAt: updatedAt || 0 })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      if (data && data.ok === false) {
        // stale：桥接那边已经有更新的结果，等下一轮 watch 再贴
        log('ack 被拒绝（结果已更新），等待下一次回传', true);
      }
    } catch (err) {
      if (attempt >= 3) {
        log('ack 失败：' + err.message + '（结果更新时会再次贴图）', true);
        return;
      }
      await sleep(2000 * Math.pow(2, attempt));
      return ackResult(base, jobId, updatedAt, attempt + 1);
    }
  }

  function scheduleRetry(jobId, updatedAt, reason) {
    var entry = findJob(jobId);
    if (!isListening(entry)) return;
    var retry = retryState[jobId] || (retryState[jobId] = { count: 0, timer: null, updatedAt: 0 });
    if (retry.timer) return;
    var delay = RETRY_DELAYS[Math.min(retry.count, RETRY_DELAYS.length - 1)];
    retry.count++;
    retry.updatedAt = updatedAt || 0;
    setStatus(jobId, '写回失败 · ' + Math.round(delay / 1000) + 's 后重试');
    log('任务 ' + jobId + ' ' + reason + '；' + Math.round(delay / 1000) + ' 秒后重试（第 ' + retry.count + ' 次）', true);
    retry.timer = setTimeout(function () {
      retry.timer = null;
      attemptApply(activeBase || server(), jobId, retry.updatedAt);
    }, delay);
  }

  function resetRetry(jobId) {
    var retry = retryState[jobId];
    if (!retry) return;
    if (retry.timer) clearTimeout(retry.timer);
    delete retryState[jobId];
  }

  function cancelRetry(jobId) {
    resetRetry(jobId);
  }

  // ---------------- 任务操作 ----------------

  function locateEntry(jobId) {
    var entry = findJob(jobId);
    if (!entry || !entry.meta || !entry.meta.targetId) {
      log('这个任务还没有可定位的原图层', true);
      return;
    }
    parent.postMessage({ pluginMessage: { type: 'find-target', targetId: entry.meta.targetId } }, '*');
  }

  function stopEntry(jobId) {
    var entry = findJob(jobId);
    if (!entry) return;
    cancelRetry(jobId);
    delete uiStatus[jobId];
    delete applyFailures[jobId];

    // 「停止」是唯一的硬停止：必须落到 stopped。
    // 不能用 failed —— 0.2.2 起 failed 仍会继续监听，设成 failed 等于没停住。
    var wasApplied = !!entry.appliedAt;
    entry.state = 'stopped';
    saveRegistry();
    renderList();

    if (wasApplied) {
      // 已经回写过：只停监听，记录留着（还能「认出原图层」）；不惊动服务端
      log('已停止监听任务 ' + jobId + '；记录还在，点「继续等待」可恢复监听');
      return;
    }

    log('已取消任务 ' + jobId + '（还没回写过，已通知 PS 端放弃）');
    // 还没回写过：通知服务端标记失败，否则 PS 面板会一直把这个任务占着
    fetch((activeBase || server()) + '/api/jobs/' + jobId + '/fail', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ error: '已在 Figma 端取消' })
    }).catch(function () {});
  }

  function resumeAll() {
    var changed = 0;
    for (var i = 0; i < registry.jobs.length; i++) {
      var entry = registry.jobs[i];
      // done 现在默认就在监听，只有被停止/失败/过期的才需要恢复
      if (!isListening(entry)) {
        entry.state = 'watching';
        entry.blockedAt = 0; // 手动恢复 = 明确要求再试一次
        delete uiStatus[entry.jobId];
        delete lastFailure[entry.jobId];
        delete applyFailures[entry.jobId];
        cancelRetry(entry.jobId);
        changed++;
      }
    }
    if (!changed) {
      log('没有需要继续等待的任务');
      return;
    }
    saveRegistry();
    renderList();
    log('已把 ' + changed + ' 个任务重新加入监听');
    startCoordinator();
  }

  function clearFinished() {
    var kept = [];
    var removed = 0;
    for (var i = 0; i < registry.jobs.length; i++) {
      var entry = registry.jobs[i];
      if (isListening(entry)) {
        kept.push(entry);
      } else {
        cancelRetry(entry.jobId);
        delete uiStatus[entry.jobId];
        delete lastFailure[entry.jobId];
        delete applyFailures[entry.jobId];
        removed++;
      }
    }
    if (!removed) {
      log('没有可清空的任务');
      return;
    }
    registry.jobs = kept;
    saveRegistry();
    renderList();
    log('已清空 ' + removed + ' 个任务记录');
  }

  // ---------------- 事件绑定 ----------------

  renderList();
  renderSendButton();

  sendBtn.addEventListener('click', function () {
    if (sending) return;
    if (!selection.count) {
      log('请先在画布上选中图片或画框', true);
      return;
    }
    // 立即置忙：双击时第二次点击直接返回，不会产生重复任务
    sending = true;
    renderSendButton();
    log('正在读取选中图层的源图…');
    parent.postMessage({ pluginMessage: { type: 'send-request', cropMode: cropModeEl.checked, newLayerMode: newLayerModeEl.checked } }, '*');
  });

  resumeBtn.addEventListener('click', resumeAll);
  clearBtn.addEventListener('click', clearFinished);

  window.onmessage = function (event) {
    var msg = event.data && event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'boot') {
      log('插件已启动 · 页面「' + msg.page + '」· 选中 ' + msg.count + ' 个 · 顶层对象 ' + msg.total + ' 个');
      if (!msg.count) log('如果画布上确实选中了对象，把这段告诉我', true);
      return;
    }

    if (msg.type === 'selection') {
      selection = msg;
      renderSendButton();
      hintEl.textContent = msg.count
        ? '已选中 ' + msg.count + ' 个图层'
        : '选中图片 → 发送到 PS → PS 里改完点「保存回传」';
      return;
    }

    if (msg.type === 'send-payloads') {
      // 主线程把每个选中节点打包好（可能为空数组 = 全部被跳过/失败）
      handleSendPayloads(msg.items || []).catch(function (err) {
        log(err.message, true);
        sending = false;
        renderSendButton();
      });
      return;
    }

    if (msg.type === 'jobs') {
      // 只有启动时主动 load-jobs 的那次才采用；save-jobs 的回显忽略，避免覆盖本地正在改的状态
      if (registryLoaded) return;
      registryLoaded = true;
      registry = normalizeValue(msg.value);
      resolveRegistryReady();
      renderList();
      if (registry.jobs.length) log('已恢复 ' + registry.jobs.length + ' 个任务记录');
      startCoordinator();
      return;
    }

    if (msg.type === 'apply-done') {
      var waiting = pendingApply[msg.jobId];
      if (waiting) {
        delete pendingApply[msg.jobId];
        waiting.resolve({ ok: !!msg.ok, error: msg.error || '', permanent: !!msg.permanent });
      }
      if (!msg.ok && !msg.permanent) log('写回失败：' + (msg.error || '未知原因'), true);
      return;
    }

    if (msg.type === 'downscale') {
      handleDownscale(msg);
      return;
    }

    if (msg.type === 'thumb-result') {
      var thumbEntry = findJob(msg.jobId);
      if (thumbEntry) {
        // data 为空表示拿不到（原图层已删/不支持导出），记 'none' 免得反复重试
        thumbEntry.thumb = msg.data ? ('data:image/png;base64,' + msg.data) : 'none';
        saveRegistry();
        renderList();
      }
      return;
    }

    if (msg.type === 'fallback-created') {
      var entry = findJob(msg.jobId);
      if (entry) {
        entry.meta = entry.meta || {};
        entry.meta.targetId = msg.targetId;
        entry.meta.targetName = msg.name;
        entry.meta.paintIndex = 0;
        entry.meta.fallback = false;
        saveRegistry();
        renderList();
        log('记下新图层「' + msg.name + '」，下次回传会覆盖它');
      }
      return;
    }

    if (msg.type === 'newlayer-created') {
      var jobEntry = findJob(msg.jobId);
      if (jobEntry) {
        jobEntry.meta = jobEntry.meta || {};
        jobEntry.meta.resultLayerId = msg.layerId;
        jobEntry.meta.resultGroupId = msg.groupId;
        saveRegistry();
        renderList();
        log('新建模式已创建画框，记下新图层供下次回传更新（原图层保留且隐藏）');
        // 同时更新后端 meta，让协调器自动回传时也能找到已创建的图层
        ensureBase().then(function (base) {
          if (!base) return;
          fetch(base + '/api/jobs/' + msg.jobId + '/meta', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ resultLayerId: msg.layerId, resultGroupId: msg.groupId })
          }).catch(function () {});
        });
      }
      return;
    }

    if (msg.type === 'target-found') {
      log('已选中原图层「' + msg.name + '」');
      return;
    }

    if (msg.type === 'target-missing') {
      log(msg.reason || '找不到原图层', true);
      return;
    }

    if (msg.type === 'diag') {
      log(msg.message, true);
      return;
    }
  };

  // 面板打开后主动问一次当前选中（有些情况 selectionchange 不会补发），再取注册表
  parent.postMessage({ pluginMessage: { type: 'request-selection' } }, '*');
  parent.postMessage({ pluginMessage: { type: 'load-jobs' } }, '*');
  startCoordinator();
  checkHealth();

  // 有任务在监听时也定期刷一下 PS 在线状态（watch 本身不返回 psOnline）
  // 自适应节奏：面板有焦点时 3 秒，切到后台 15 秒（空闲时的节奏在 coordinatorStep 里）
  // 有任务在监听时由长轮询驱动 PS 状态刷新，这里只在“没有监听任务”时补一轮，避免双倍请求
  function healthTick() {
    var anyListening = false;
    for (var i = 0; i < registry.jobs.length; i++) {
      if (isListening(registry.jobs[i])) { anyListening = true; break; }
    }
    if (!anyListening) checkHealth().catch(function () {});
    setTimeout(healthTick, idleDelay());
  }
  setTimeout(healthTick, idleDelay());

  // 从后台切回来时立刻刷一次，别等下一轮
  try {
    window.addEventListener('focus', function () { checkHealth().catch(function () {}); });
  } catch (e) { /* 宿主不支持时忽略 */ }
  try {
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') checkHealth().catch(function () {});
    });
  } catch (e) { /* 宿主不支持时忽略 */ }
})();
</script>
</body>
</html>
